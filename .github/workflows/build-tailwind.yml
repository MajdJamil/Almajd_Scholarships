name: Build Tailwind CSS

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build tailwind-output.css from current content
        run: npm run build:css

      - name: Commit tailwind-output.css if it changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: rebuild tailwind css [automated]"
          file_pattern: assets/tailwind-output.css
